name: Rust

# Biome, the wasm fingerprint and the typecheck; the Rust crates' fmt, clippy
# and tests; then a wasm build from source with the JavaScript tests run
# against it. The committed zarrita.wasm is not byte-reproducible across build
# hosts, so it is not diffed here; `bun run lint` checks its source fingerprint
# instead (scripts/wasm-fingerprint.mjs).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (zarrita-rs)
    # Pinned: apt.llvm.org has no LLVM 20 repository for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    env:
      # zstd's C sources need a clang that targets wasm32.
      CC_wasm32_unknown_unknown: clang-20
      AR_wasm32_unknown_unknown: llvm-ar-20
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain, target and components pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - name: LLVM 20
        run: wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Lint and wasm fingerprint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Rust fmt and clippy
        run: bun run lint:rust

      - name: Rust tests
        run: bun run test:rust

      - name: Build the wasm module from source
        run: bun run build:wasm

      - name: JavaScript tests against the fresh build
        run: bun run test
